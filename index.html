    // ── LICENSE HELPERS ──────────────────────────────────────────────────────
    function getDeviceId() {
      const nav = window.navigator;
      const raw = [nav.userAgent, nav.language, screen.width, screen.height,
        nav.hardwareConcurrency, Intl.DateTimeFormat().resolvedOptions().timeZone].join('|');
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i); hash |= 0;
      }
      return Math.abs(hash).toString(36).toUpperCase().slice(0, 8);
    }
    const SECRET = "GULCRM2024";

    function generateCode(deviceId, months) {
      const d = new Date();
      d.setMonth(d.getMonth() + months);
      const ym = d.getFullYear() * 100 + (d.getMonth() + 1);
      const expCode = ym.toString(36).toUpperCase().padStart(4,'0');
      const raw = deviceId.toUpperCase() + SECRET + expCode;
      let h1 = 0x811c9dc5; let h2 = 0xdeadbeef;
      for (let i = 0; i < raw.length; i++) {
        h1 ^= raw.charCodeAt(i); h1 = Math.imul(h1, 0x01000193) >>> 0;
        h2 ^= raw.charCodeAt(raw.length-1-i); h2 = Math.imul(h2, 0x9e3779b9) >>> 0;
      }
      const p1 = (h1>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6);
      const p3 = (h2>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6);
      return p1+"-"+expCode+"-"+p3;
    }

    function checkLicense(lic) {
      if (!lic) return false;
      return new Date(lic.expiresAt) > new Date();
    }

    function activateLicense(inputCode) {
      const deviceId = getDeviceId();
      const clean = inputCode.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if (clean.length < 14) return null;
      const p1 = clean.slice(0,6);
      const expCode = clean.slice(6,10);
      const p3 = clean.slice(10,16);
      // Decode expiry
      const ym = parseInt(expCode, 36);
      const year = Math.floor(ym/100);
      const month = ym % 100;
      if (year < 2024 || year > 2040 || month < 1 || month > 12) return null;
      // Verify hash
      const raw = deviceId.toUpperCase() + SECRET + expCode;
      let h1 = 0x811c9dc5; let h2 = 0xdeadbeef;
      for (let i = 0; i < raw.length; i++) {
        h1 ^= raw.charCodeAt(i); h1 = Math.imul(h1, 0x01000193) >>> 0;
        h2 ^= raw.charCodeAt(raw.length-1-i); h2 = Math.imul(h2, 0x9e3779b9) >>> 0;
      }
      const expP1 = (h1>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6);
      const expP3 = (h2>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6);
      if (p1 !== expP1 || p3 !== expP3) return null;
      const expiresAt = new Date(year, month-1, 1);
      return {activatedAt: new Date().toISOString(), expiresAt: expiresAt.toISOString()};
    }
    // Use window variable as fallback if localStorage unavailable
    const INSTALL_VER = "v1";
    try {
      const savedVer = localStorage.getItem("gulcrm_ver");
      const savedDate = localStorage.getItem("gulcrm_install");
      // Reset if version changed or date is invalid/too old
      if (savedVer !== INSTALL_VER || !savedDate) {
        const now = new Date().toISOString();
        localStorage.setItem("gulcrm_install", now);
        localStorage.setItem("gulcrm_ver", INSTALL_VER);
        window._gulInstall = now;
      } else {
        window._gulInstall = savedDate;
      }
    } catch(e) {
      window._gulInstall = new Date().toISOString();
    }
    function getInstallDate() {
      return new Date(window._gulInstall || new Date().toISOString());
    }
    function isTrialActive() {
      return (new Date() - getInstallDate()) < 30 * 24 * 60 * 60 * 1000;
    }
    function trialDaysLeft() {
      const msLeft = 30*24*60*60*1000 - (new Date() - getInstallDate());
      return Math.max(0, Math.ceil(msLeft / (24*60*60*1000)));
    }

// ─── CURRENCY ────────────────────────────────────────────────────────────────
const CURR = {
  uzs:{sym:"сум", sym_uz:"so'm", rate:1},
  rub:{sym:"₽",   sym_uz:"₽",   rate:0.0082},
  usd:{sym:"$",   sym_uz:"$",   rate:0.000079},
};
function fmtP(uzs, cur, lang) {
  const c = CURR[cur];
  const v = Math.round(uzs * c.rate);
  if (cur === "usd") return "$" + v.toFixed(0);
  return v.toLocaleString("ru") + " " + (lang === "uz" ? c.sym_uz : c.sym);
}

  t:"linear-gradient(135deg,#14B8A6,#2DD4BF)",
};
const AVCL = ["p","g","a","r","b","t"];

const STC = {
  paid:    ["rgba(52,211,153,.12)", "#34D399", "rgba(52,211,153,.25)"],
  debt:    ["rgba(251,146,60,.12)", "#FB923C", "rgba(251,146,60,.25)"],
  sub:     ["rgba(255,107,157,.12)", "#C084FC", "rgba(255,107,157,.25)"],
  pending: ["rgba(148,163,184,.1)", "#94A3B8", "rgba(100,116,139,.2)"],
};

// ─── SMALL COMPONENTS ────────────────────────────────────────────────────────
function Av({l, c, sz=44}) {
  return (
    <div style={{width:sz, height:sz, borderRadius:"50%", background:AVC[c]||AVC.p,
      display:"flex", alignItems:"center", justifyContent:"center",
      color:"#fff", fontWeight:800, fontSize:sz*.38, flexShrink:0}}>
      {l}
    </div>
  );
}

function Bdg({type, text}) {
  const s = STC[type] || STC.paid;
  return (
    <span style={{fontSize:10, fontWeight:700, padding:"3px 9px", borderRadius:20,
      background:s[0], color:s[1], whiteSpace:"nowrap"}}>
      {text}
    </span>
  );
}

function Modal({open, onClose, children, isDark=true}) {
  if (!open) return null;
  const bg = isDark ? "#1C1035" : "#FFFFFF";
  const bd = isDark ? "rgba(255,107,157,.12)" : "rgba(192,84,252,.1)";
  return (
    <div onClick={e => { if (e.target === e.currentTarget) onClose(); }}
      style={{position:"absolute", inset:0, background:"rgba(0,0,0,.82)", zIndex:300,
        backdropFilter:"blur(18px)", display:"flex", alignItems:"flex-end"}}>
      <div style={{width:"100%", background:bg, borderRadius:"24px 24px 0 0",
        padding:"16px 18px 30px", animation:"slideUp .3s ease-out",
        maxHeight:"90%", overflowY:"auto", border:"1px solid "+bd, borderBottom:"none"}}>
        <div style={{width:40, height:4, borderRadius:2, margin:"0 auto 16px", background:"linear-gradient(90deg,#FF6B9D,#C084FC)"}} />
        {children}
      </div>
    </div>
  );
}

function Toast({msg, icon, isDark=true}) {
  return (
    <div style={{position:"absolute", top:14, left:16, right:16,
      background:"linear-gradient(135deg,rgba(255,107,157,.15),rgba(192,132,252,.1))",
      backdropFilter:"blur(20px)",
      border:"1px solid rgba(255,107,157,.3)", borderRadius:18,
      padding:"12px 16px", display:"flex", alignItems:"center", gap:10,
      boxShadow:"0 8px 32px rgba(255,107,157,.25)", zIndex:500,
      animation:"slideDown .4s cubic-bezier(.34,1.56,.64,1)"}}>
      <span style={{fontSize:20}}>{icon}</span>
      <span style={{fontSize:13, fontWeight:700, color:"#FFF0F8"}}>{msg}</span>
    </div>
  );
}

// ─── SERVICE BUILDER ─────────────────────────────────────────────────────────
function buildServices(profileKey) {
  const p = PROFILES[profileKey];
  return p.sru.map((name, i) => ({
    id: i+1,
    name,
    nameUz: p.suz[i],
    price: p.p[i],
    dur: 60,
  }));
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {

  // ── settings & ui state ──
  const [step,       setStep]       = useState("onboarding");
  const [profile,    setProfile]    = useState("nail");
  const [license,    setLicense]    = useState(null); // {activatedAt, expiresAt, code}
  const [licScreen,  setLicScreen]  = useState(false);
  const [licInput,   setLicInput]   = useState("");
  const [licError,   setLicError]   = useState("");
  const [currency,   setCurrency]   = useState("uzs");
  const [lang,       setLang]       = useState("ru");
  const [dark,       setDark]       = useState(false);
  const [screen,     setScreen]     = useState("dashboard");
  const [toast,      setToast]      = useState(null);
  const [modal,      setModal]      = useState(null);

  // ── data ──
  const [clients,  setClients]  = useState(DEMO_CL);
  const [appts,    setAppts]    = useState(DEMO_AP);
  const [subs,     setSubs]     = useState(DEMO_SB);
  const [expenses, setExpenses] = useState(DEMO_EX);

  // ── calendar ──
  const [weekOffset, setWeekOffset] = useState(0);
  const [selDay,     setSelDay]     = useState(new Date());

  // ── work config ──
  const [workCfg, setWorkCfg] = useState({start:"09:00", end:"20:00", offDays:[0]});

  // ── modal state ──
  const [editAppt,   setEditAppt]   = useState(null);
  const [selClient,  setSelClient]  = useState(null);
  const [tgMsg,      setTgMsg]      = useState("");
  const [finTab,     setFinTab]     = useState("debt");
  const [statPeriod, setStatPeriod] = useState(0);
  const [statTab,    setStatTab]    = useState("overview");
  const [clFilter,   setClFilter]   = useState("");
  const [syncing,    setSyncing]    = useState(false);
  const [confirmDup, setConfirmDup] = useState(false);
  const [apptStep,   setApptStep]   = useState(1);
  const [mktPrev,    setMktPrev]    = useState(null);
  const [closeAppt,  setCloseAppt]  = useState(null);
  const [myServices, setMyServices] = useState(() => buildServices("nail"));
  const [editSvc,    setEditSvc]    = useState(null); // запись которую закрываем

  // ── Авто-попап закрытия: проверяем каждые 30 сек ──
  useEffect(() => {
    function checkPending() {
      if (modal) return; // не перебивать открытый попап
      const now = new Date();
      const todayKey2 = dkey(now);
      const nowMin2 = now.getHours()*60 + now.getMinutes();
      // Ищем первую запись с pending статусом у которой время уже прошло
      const pending = appts.find(a => {
        if (a.status !== "pending") return false;
        if (a.dateKey !== todayKey2) return false; // только сегодня
        const [hh,mm] = a.time.split(":").map(Number);
        return hh*60 + mm + (a.dur||60) <= nowMin2; // запись закончилась
      });
      if (pending) {
        setCloseAppt(pending);
        setModal("close_appt");
      }
    }
    checkPending();
    const timer = setInterval(checkPending, 30000);
    return () => clearInterval(timer);
  }, [appts, modal]);

  // ── forms ──
  const [form,    setForm]    = useState({clientId:"", svc:"", priceUzs:"", date:"", time:"10:00", dur:90, status:"paid"});
  const [clForm,  setClForm]  = useState({name:"", phone:"", birthday:"", note:""});
  const [expForm, setExpForm] = useState({catId:"materials", desc:"", amtUzs:"", date:""});

  // ── storage (localStorage) ──
  const saveRef = useRef(null);
  useEffect(() => {
    try {
      const saved = localStorage.getItem("bp6");
      if (!saved) return;
      const s = JSON.parse(saved);
        if (s.profile)   setProfile(s.profile);
        if (s.currency)  setCurrency(s.currency);
        if (s.lang)      setLang(s.lang);
        if (s.dark!=null) setDark(s.dark);
        if (s.clients)   setClients(s.clients);
        if (s.appts)     setAppts(s.appts);
        if (s.subs)      setSubs(s.subs);
        if (s.expenses)  setExpenses(s.expenses);
        if (s.workCfg)   setWorkCfg(s.workCfg);
        if (s.myServices) setMyServices(s.myServices);
        else if (s.profile) setMyServices(buildServices(s.profile));
        if (s.done)       setStep("app");
    } catch(e) {}
  }, []);

  useEffect(() => {
    if (step !== "app") return;
    clearTimeout(saveRef.current);
    saveRef.current = setTimeout(() => {
      try {
        localStorage.setItem("bp6", JSON.stringify({
          done:true, profile, currency, lang, dark,
          clients, appts, subs, expenses, workCfg, myServices, license
        }));
      } catch(e) {}
    }, 800);
  }, [step, profile, currency, lang, dark, clients, appts, subs, expenses, workCfg, myServices, license]);

  // Пересобираем услуги при смене профессии
  const prevProfileRef = useRef(null);
  useEffect(() => {
    if (prevProfileRef.current !== null && prevProfileRef.current !== profile) {
      setMyServices(buildServices(profile));
    }
    prevProfileRef.current = profile;
  }, [profile]);

  // ── derived ──
  const pr  = PROFILES[profile];
  const fp  = (uzs) => fmtP(uzs, currency, lang);

  // Используем myServices вместо захардкоженных pr.sru/p
  const svcs      = myServices.map(s => lang==="uz" ? s.nameUz : s.name);
  const svcPrices = myServices.map(s => s.price);
  const svcDurs   = myServices.map(s => s.dur);

  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const todayK = dkey(todayD);
  const selKey = dkey(selDay);

  const weekStart = new Date(todayD);
  const dow = todayD.getDay();
  weekStart.setDate(todayD.getDate() - (dow === 0 ? 6 : dow - 1) + weekOffset * 7);
  const weekDays = Array.from({length:7}, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    return d;
  });

  const dayAppts = appts.filter(a => a.dateKey === selKey).sort((a,b) => a.time.localeCompare(b.time));
  const isPast   = selKey < todayK;
  const isToday  = selKey === todayK;
  const isOff    = workCfg.offDays.includes(selDay.getDay());
  const workHours = HOURS.filter(h => h >= workCfg.start && h <= workCfg.end);

  function canAdd(h) {
    if (isPast) return false;
    if (!isToday) return true;
    const [hh, mm] = h.split(":").map(Number);
    const now = new Date();
    return hh * 60 + mm > now.getHours() * 60 + now.getMinutes();
  }
  const canAddAny = !isPast && (!isToday || workHours.some(h => canAdd(h)));

  const debtors   = clients.map(c => ({
    ...c,
    debtUzs: appts.filter(a => a.clientId === c.id && a.status === "debt").reduce((s,a) => s + a.priceUzs, 0)
  })).filter(c => c.debtUzs > 0);
  const totalDebt = debtors.reduce((s,c) => s + c.debtUzs, 0);

  // stat helpers
  function periodKeys(n) {
    const ks = new Set();
    const now = new Date(); now.setHours(0,0,0,0);
    for (let i = 0; i < n; i++) {
      const d = new Date(now); d.setDate(now.getDate() - i); ks.add(dkey(d));
    }
    return ks;
  }
  const statN = statPeriod === 0 ? 1 : statPeriod === 1 ? 7 : 30;
  const statKeys  = periodKeys(statN);
  const statAppts = appts.filter(a => statKeys.has(a.dateKey) && a.status !== "debt");
  const statExps  = expenses.filter(e => statKeys.has(e.dateKey));
  const revenue   = statAppts.reduce((s,a) => s + a.priceUzs, 0);
  const totalExp  = statExps.reduce((s,e) => s + e.amtUzs, 0);
  const profit    = revenue - totalExp;

  // ── helpers ──
  function showToast(msg, icon) {
    setToast({msg, icon: icon||"✅"});
    setTimeout(() => setToast(null), 2500);
  }

  function dayLabel() {
    if (selKey === todayK) return lang === "uz" ? "Bugun" : "Сегодня";
    const yd = new Date(todayD); yd.setDate(todayD.getDate()-1);
    const tm = new Date(todayD); tm.setDate(todayD.getDate()+1);
    if (selKey === dkey(yd)) return lang === "uz" ? "Kecha" : "Вчера";
    if (selKey === dkey(tm)) return lang === "uz" ? "Ertaga" : "Завтра";
    return fmtDate(selKey, lang);
  }

  function openAdd(time) {
    const t = time || "10:00";
    setForm({
      clientId: clients[0]?.id || "",
      svc: svcs[0] || "",
      priceUzs: String(svcPrices[0] || 0),
      date: selKey,
      time: t,
      dur: svcDurs[0] || 60,
      status: "pending"
    });
    setEditAppt(null);
    setApptStep(1);
    setConfirmDup(false);
    setModal("appt");
  }

  function openEdit(a) {
    setForm({clientId:a.clientId, svc:a.svc, priceUzs:String(a.priceUzs), date:a.dateKey, time:a.time, dur:a.dur, status:a.status});
    setEditAppt(a);
    setApptStep(1);
    setConfirmDup(false);
    setModal("appt");
  }

  function saveAppt() {
    if (!form.clientId || !form.svc || !form.date || !form.time) {
      showToast(lang==="uz"?"Barcha maydonlarni to'ldiring":"Заполните все поля", "⚠️"); return;
    }
    if (!editAppt) {
      if (form.date < todayK) { showToast(lang==="uz"?"O'tgan sanaga yozib bo'lmaydi":"Нельзя записать в прошлое","⛔"); return; }
      if (form.date === todayK) {
        const [hh,mm] = form.time.split(":").map(Number);
        const now = new Date();
        if (hh*60+mm <= now.getHours()*60+now.getMinutes()) {
          showToast(lang==="uz"?"Bu vaqt o'tib ketdi":"Это время уже прошло","⛔"); return;
        }
      }
    }

    // ── Проверка конфликтов ──
    const newStart = (() => { const [h,m]=form.time.split(":").map(Number); return h*60+m; })();
    const newEnd   = newStart + (+form.dur || 60);
    const daySlots = appts.filter(a => a.dateKey === form.date && (!editAppt || a.id !== editAppt.id));

    for (const a of daySlots) {
      const aStart = (() => { const [h,m]=a.time.split(":").map(Number); return h*60+m; })();
      const aEnd   = aStart + (a.dur || 60);
      // перекрытие: новая запись начинается до конца существующей И заканчивается после начала существующей
      if (newStart < aEnd && newEnd > aStart) {
        const who  = lang==="uz" ? a.clientName_uz : a.clientName;
        const msg  = lang==="uz"
          ? `${a.time} — ${who} yozuvi bilan to'qnashadi!`
          : `${a.time} — конфликт с записью клиента ${who}!`;
        showToast(msg, "⛔"); return;
      }
    }

    // Предупреждение: клиент уже записан в этот день
    const cl = clients.find(c => c.id === +form.clientId) || clients[0];
    const alreadyToday = daySlots.filter(a => a.clientId === cl.id);
    // Предупреждение: клиент уже записан в этот день (предупреждаем один раз)
    if (alreadyToday.length > 0 && !confirmDup) {
      const times = alreadyToday.map(a => a.time).join(", ");
      showToast(
        lang==="uz"
          ? `⚠️ ${cl.name_uz} bugun ${times} da yozilgan. Davom etish uchun qaytadan bosing.`
          : `⚠️ ${cl.name} уже записан(а) в ${times}. Нажмите ещё раз для подтверждения.`,
        "⚠️"
      );
      setConfirmDup(true);
      return;
    }
    setConfirmDup(false);

    const si = svcs.indexOf(form.svc);
    const svcRu  = myServices[si]?.name    || form.svc;
    const svcUz  = myServices[si]?.nameUz  || form.svc;
    if (editAppt) {
      setAppts(prev => prev.map(a => a.id === editAppt.id
        ? {...a, dateKey:form.date, time:form.time, clientId:cl.id,
            clientName:cl.name, clientName_uz:cl.name_uz,
            svc:svcRu, svc_uz:svcUz,
            priceUzs:+form.priceUzs, dur:+form.dur, status:form.status}
        : a));
      showToast(lang==="uz"?"Yozuv yangilandi!":"Запись обновлена!", "✏️");
    } else {
      setAppts(prev => [...prev, {
        id: Date.now(), dateKey:form.date, time:form.time,
        clientId:cl.id, clientName:cl.name, clientName_uz:cl.name_uz,
        svc:svcRu, svc_uz:svcUz,
        priceUzs:+form.priceUzs, dur:+form.dur, status:form.status
      }]);
      showToast(lang==="uz"?"Yozuv qo'shildi!":"Запись добавлена!", "✅");
    }
    setModal(null);
  }

  function saveClient() {
    if (!clForm.name.trim()) { showToast(lang==="uz"?"Ism kiriting":"Введите имя","⚠️"); return; }
    const id = Date.now();
    setClients(prev => [...prev, {
      id, name:clForm.name.trim(), name_uz:clForm.name.trim(),
      av: clForm.name.trim()[0].toUpperCase(),
      avc: AVCL[prev.length % AVCL.length],
      phone:clForm.phone, birthday:clForm.birthday, note:clForm.note
    }]);
    setClForm({name:"", phone:"", birthday:"", note:""});
    showToast(lang==="uz"?"Mijoz qo'shildi!":"Клиент добавлен!", "👤");
    setModal(null);
  }

  function saveExp() {
    if (!expForm.desc.trim() || !expForm.amtUzs || !expForm.date) {
      showToast(lang==="uz"?"Barcha maydonlarni to'ldiring":"Заполните все поля","⚠️"); return;
    }
    setExpenses(prev => [...prev, {
      id:Date.now(), dateKey:expForm.date, catId:expForm.catId,
      desc:expForm.desc, amtUzs:+expForm.amtUzs
    }]);
    showToast(lang==="uz"?"Xarajat qo'shildi!":"Расход добавлен!","💸");
    setModal(null);
  }

  // ── css vars (inline style on root) ──
  // ── DESIGN TOKENS ──────────────────────────────────────────────────────────
  const bg  = dark ? "#0D0620"  : "#FFF5FB";
  const sf  = dark ? "#1C1035"  : "#FFFFFF";
  const sf2 = dark ? "#241540"  : "#F8EEFF";
  const bd  = dark ? "rgba(255,107,157,.12)" : "rgba(192,84,252,.12)";
  const tx  = dark ? "#FFF0F8"  : "#1A0A2E";
  const tx2 = dark ? "#C4A8D4"  : "#6B4080";
  const tx3 = dark ? "#7A5F8A"  : "#A880C0";
  const cg  = dark ? "#1C1035"  : "#FFFFFF";
  const cb  = dark ? "rgba(255,107,157,.12)" : "rgba(192,84,252,.1)";
  const acc  = dark ? "#FF6B9D" : "#E0409A";
  const acc2 = dark ? "#C084FC" : "#9B59D0";
  const grad  = "linear-gradient(135deg,#FF6B9D,#C084FC,#818CF8)";
  const glow  = dark
    ? "0 0 24px rgba(255,107,157,.22),0 8px 28px rgba(192,132,252,.18)"
    : "0 0 16px rgba(224,64,154,.12),0 8px 20px rgba(155,89,208,.08)";

  const card = {background:cg, borderRadius:22, border:"1px solid "+cb,
    boxShadow:dark?"0 4px 24px rgba(0,0,0,.4)":"0 2px 16px rgba(192,84,252,.07)"};
  const inp  = {width:"100%", height:48, borderRadius:14, border:"1.5px solid "+bd, background:sf2, color:tx, fontSize:14, padding:"0 16px", outline:"none", fontFamily:"inherit"};
  const priBtn = {width:"100%", height:52, borderRadius:18, border:"none", background:grad, color:"#fff", fontSize:15, fontWeight:800, cursor:"pointer", boxShadow:glow, fontFamily:"inherit"};
  const secBtn = {width:"100%", height:46, borderRadius:14, border:"1.5px solid "+bd, background:sf2, color:tx2, fontSize:14, fontWeight:600, cursor:"pointer", marginTop:8, fontFamily:"inherit"};
  const danBtn = {width:"100%", height:46, borderRadius:14, border:"1.5px solid rgba(251,113,133,.3)", background:"rgba(251,113,133,.08)", color:"#FB7185", fontSize:14, fontWeight:600, cursor:"pointer", marginTop:4, fontFamily:"inherit"};

  // ── ONBOARDING ────────────────────────────────────────────────────────────
  if (step === "onboarding") {
    return (
      <div style={{minHeight:"100vh", background:dark?"#0D0620":"#FFF5FB", display:"flex", alignItems:"center", justifyContent:"center", padding:16}}>
        
        <div style={{width:"100%", maxWidth:460, background:cg, borderRadius:28, overflow:"hidden", boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
          <div style={{padding:"28px 22px 18px", textAlign:"center", background:"linear-gradient(135deg,rgba(192,132,252,.15),rgba(129,140,248,.08))"}}>
            <div style={{fontSize:36, marginBottom:6}}>✦</div>
            <div style={{fontWeight:800, fontSize:24, background:"linear-gradient(135deg,#FF6B9D,#C084FC,#818CF8)", backgroundSize:"200%", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:8, animation:"shimmer 3s linear infinite"}}>GulCRM</div>
            <div style={{fontSize:13, color:tx2, lineHeight:1.6}}>{lang==="ru"?"Умный CRM для beauty-мастеров":"Beauty ustalari uchun aqlli CRM"}</div>
            <div style={{display:"flex", justifyContent:"center", gap:8, marginTop:12}}>
              {["ru","uz"].map(l => (
                <button key={l} onClick={() => setLang(l)} style={{padding:"5px 16px", borderRadius:20, border:`2px solid ${lang===l?acc:bd}`, background:lang===l?"rgba(255,107,157,.12)":"transparent", color:lang===l?acc:tx2, fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"inherit"}}>{l.toUpperCase()}</button>
              ))}
              <button onClick={() => setDark(d => !d)} style={{padding:"5px 12px", borderRadius:20, border:`2px solid ${bd}`, background:"transparent", cursor:"pointer", fontSize:13, fontFamily:"inherit"}}>{dark?"☀️":"🌙"}</button>
            </div>
          </div>
          <div style={{padding:"18px 18px 0"}}>
            <div style={{fontSize:11, fontWeight:700, color:tx3, letterSpacing:.6, marginBottom:10, textTransform:"uppercase"}}>{lang==="ru"?"Выберите направление":"Yo'nalishingizni tanlang"}</div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:18}}>
              {Object.entries(PROFILES).map(([k,p]) => (
                <button key={k} onClick={() => setProfile(k)} style={{borderRadius:14, border:`2px solid ${profile===k?"#FF6B9D":bd}`, background:profile===k?"rgba(255,107,157,.1)":bg, padding:"11px 8px", textAlign:"center", cursor:"pointer", fontFamily:"inherit"}}>
                  <div style={{fontSize:24, marginBottom:4}}>{p.emoji}</div>
                  <div style={{fontSize:11, fontWeight:700, color:profile===k?acc2:tx, lineHeight:1.3}}>{lang==="uz"?p.uz:p.ru}</div>
                </button>
              ))}
            </div>
            <div style={{fontSize:11, fontWeight:700, color:tx3, letterSpacing:.6, marginBottom:10, textTransform:"uppercase"}}>{lang==="ru"?"Валюта":"Valyuta"}</div>

      const [hh,mm] = a.time.split(":").map(Number);
      return hh*60+mm > nowMin;

    // Минут до следующей записи

      return hh*60+mm - nowMin;

                            {!isPending && <Bdg type={a.status} text={a.status==="paid"?(lang==="uz"?"To'langan":"Оплачено"):a.status==="debt"?(lang==="uz"?"Qarz":"Долг"):(lang==="uz"?"Abonement":"Абонемент")} />}

                          </div>
                        </div>
                        <div style={{textAlign:"right", flexShrink:0}}>
                          {a.priceUzs > 0 && <div style={{fontWeight:800, fontSize:15, color:showClose?acc2:sc[1]}}>{fp(a.priceUzs)}</div>}

                              👋 {lang==="uz"?"Yopish":"Закрыть"}
                            </div>
                          )}
                          {a.status === "debt" && (
                            <button onClick={e => { e.stopPropagation(); setAppts(prev => prev.map(x => x.id===a.id?{...x,status:"paid"}:x)); showToast(lang==="uz"?"To'landi!":"Оплачено!","✅"); }}
                              style={{marginTop:5, fontSize:10, fontWeight:700, padding:"3px 8px", borderRadius:9, border:"1.5px solid #10B981", background:"rgba(16,185,129,.1)", color:"#10B981", cursor:"pointer", fontFamily:"inherit"}}>
                              {lang==="uz"?"To'landi":"Оплачено ✓"}
                            </button>
                          )}
                        </div>
                      </div>
                      {/* Баннер «закрыть запись» */}
                      {showClose && (
                        <div style={{marginTop:8, marginLeft:8, padding:"6px 10px", borderRadius:8, background:"rgba(255,107,157,.12)", display:"flex", alignItems:"center", gap:6}}>

                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              {canAddAny && (
                <div onClick={() => openAdd()} style={{display:"flex", gap:10, alignItems:"center", marginTop:2, cursor:"pointer", opacity:.65}}>
                  <span style={{width:38}} />
                  <div style={{flex:1, height:38, borderRadius:11, border:`1.5px dashed ${bd}`, display:"flex", alignItems:"center", justifyContent:"center", gap:6, color:tx3, fontSize:13, fontWeight:600}}>
                    ＋ {lang==="uz"?"Yangi yozuv":"Новая запись"}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    );

                  <div style={{flex:1}}>

        </div>

      </>

    // ── STEP 2: дата, время, длительность, статус ──
    const Step2 = () => {
      const nowWarn = !editAppt && form.date===todayK && (() => {
        const [hh,mm] = form.time.split(":").map(Number);

        return hh*60+mm <= now2.getHours()*60+now2.getMinutes();
      })();

      return (
        <>
          <div style={{fontWeight:800, fontSize:18, marginBottom:4, color:tx}}>{title}</div>

              <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date:e.target.value}))} style={{...inp, flex:1.5}} min={editAppt?undefined:todayK}/>

            </div>
            {nowWarn && <div style={{fontSize:11, color:"#F43F5E", marginTop:4}}>⛔ {lang==="uz"?"Bu vaqt o'tib ketgan":"Это время уже прошло"}</div>}
          </div>

          {/* Duration — крупные кнопки */}
          <div style={{marginBottom:13}}>
            <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:7}}>{lang==="uz"?"Davomiylik":"Длительность"}</label>
            <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6}}>
              {[[30,"30"],[45,"45"],[60,"1ч"],[90,"1.5ч"],[120,"2ч"],[150,"2.5ч"],[180,"3ч"]].map(([v,l2]) => (
                <button key={v} onClick={() => setForm(f => ({...f, dur:v}))}
                  style={{height:36, borderRadius:10, border:`1.5px solid ${form.dur===v?acc2:bd}`,
                    background:form.dur===v?"rgba(255,107,157,.12)":sf2,
                    color:form.dur===v?acc2:tx2, fontWeight:600, fontSize:12, cursor:"pointer", fontFamily:"inherit"}}>
                  {l2}
                </button>
              ))}
            </div>
          </div>

          {/* Status — только при редактировании существующей записи */}
          {isEdit && (
            <div style={{marginBottom:16}}>
              <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:7}}>{lang==="uz"?"To'lov":"Оплата"}</label>
              <div style={{display:"flex", gap:7}}>
                {[
                  ["paid","#10B981","rgba(16,185,129,.1)",lang==="uz"?"✅ To'langan":"✅ Оплачено"],
                  ["debt","#F59E0B","rgba(245,158,11,.1)",lang==="uz"?"⏳ Qarz":"⏳ Долг"],
                  ["sub","#8B5CF6","rgba(139,92,246,.1)",lang==="uz"?"🎫 Abonement":"🎫 Абонемент"],
                ].map(([s,c,bg2,lbl]) => (
                  <button key={s} onClick={() => setForm(f => ({...f, status:s}))}
                    style={{flex:1, height:44, borderRadius:11, border:`1.5px solid ${form.status===s?c:bd}`,
                      background:form.status===s?bg2:sf2, color:form.status===s?c:tx2,
                      fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"inherit", lineHeight:1.3}}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
          )}
          {/* Для новой записи — подсказка */}
          {!isEdit && (
            <div style={{marginBottom:16, padding:"10px 13px", borderRadius:12, background:"rgba(255,107,157,.08)", border:"1px solid rgba(192,132,252,.2)"}}>
              <div style={{fontSize:12, color:acc2, fontWeight:600}}>
                💡 {lang==="uz"?"Mijoz ketganidan so'ng to'lov holati so'raladi":"Статус оплаты спросим после визита"}
              </div>
            </div>
          )}

          <button onClick={saveAppt} style={priBtn}>{lang==="uz"?"Saqlash ✓":"Сохранить ✓"}</button>
          {isEdit && (
            <button onClick={() => { setAppts(prev => prev.filter(a => a.id!==editAppt.id)); showToast(lang==="uz"?"O'chirildi!":"Удалено!","🗑️"); setModal(null); }} style={danBtn}>
              🗑️ {lang==="uz"?"Yozuvni o'chirish":"Удалить запись"}
            </button>
          )}
          <button onClick={() => setModal(null)} style={secBtn}>{lang==="uz"?"Bekor qilish":"Отмена"}</button>
        </>
      );
    };

    return (
      <Modal isDark={dark} open={modal==="appt"} onClose={() => setModal(null)}>
        <StepDots/>
        {apptStep === 1 ? <Step1/> : <Step2/>}
      </Modal>
    );
  }

    function closeWith(status) {
      setAppts(prev => prev.map(a =>
        a.id === closeAppt.id ? {...a, status} : a

      setModal(null);
      setCloseAppt(null);

      showToast(labels[status] || status, "✅");

      <Modal isDark={dark} open={modal==="close_appt"} onClose={() => { setModal(null); setCloseAppt(null); }}>

            {closeAppt.priceUzs > 0 && <span style={{color:acc2}}> · {fp(closeAppt.priceUzs)}</span>}

        </div>

        {/* Separator */}
        <div style={{height:1, background:bd, marginBottom:16}}/>

        <div style={{fontSize:12, fontWeight:700, color:tx3, letterSpacing:.5, textTransform:"uppercase", marginBottom:12, textAlign:"center"}}>
          {lang==="uz"?"To'lov holati qanday?":"Как оплатил(а) клиент?"}
        </div>

        {/* Big payment buttons */}
        <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:8}}>
          <button onClick={() => closeWith("paid")}
            style={{width:"100%", height:56, borderRadius:16, border:"none",
              background:"linear-gradient(135deg,#10B981,#34D399)",
              color:"#fff", fontWeight:800, fontSize:16, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", gap:10,
              boxShadow:"0 4px 16px rgba(16,185,129,.35)", fontFamily:"inherit"}}>
            <span style={{fontSize:22}}>✅</span>
            {lang==="uz"?"To'ladi (naqd / karta)":"Оплатил(а) (наличные / карта)"}
          </button>

          <button onClick={() => closeWith("sub")}
            style={{width:"100%", height:56, borderRadius:16, border:"none",
              background:"linear-gradient(135deg,#C084FC,#818CF8)",
              color:"#fff", fontWeight:800, fontSize:16, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", gap:10,
              boxShadow:"0 4px 16px rgba(139,92,246,.35)", fontFamily:"inherit"}}>
            <span style={{fontSize:22}}>🎫</span>
            {lang==="uz"?"Abonement":"Абонемент"}
          </button>

          <button onClick={() => closeWith("debt")}
            style={{width:"100%", height:56, borderRadius:16,
              border:"1.5px solid rgba(245,158,11,.4)",
              background:"rgba(245,158,11,.08)",
              color:"#F59E0B", fontWeight:800, fontSize:16, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", gap:10,
              fontFamily:"inherit"}}>
            <span style={{fontSize:22}}>⏳</span>
            {lang==="uz"?"Keyin to'laydi (qarz)":"Оплатит позже (долг)"}
          </button>
        </div>

        <button onClick={() => { setModal(null); setCloseAppt(null); }}
          style={{...secBtn, marginTop:4}}>
          {lang==="uz"?"Keyinroq":"Позже"}
        </button>
      </Modal>
    );
  }
  function modalEditSvc() {
    if (!editSvc) return null;
    const durOpts = [15,30,45,60,90,120,150,180];
    return (
      <Modal isDark={dark} open={modal==="edit_svc"} onClose={() => setModal(null)}>
        <div style={{fontWeight:800, fontSize:18, marginBottom:4, color:tx}}>
          ✏️ {lang==="uz"?"Xizmatni tahrirlash":"Редактировать услугу"}
        </div>
        <div style={{fontSize:12, color:tx3, marginBottom:16}}>
          {lang==="uz"?"Nom, narx va davomiylikni o'zgartiring":"Измените название, цену и длительность"}
        </div>

        {/* Name RU */}
        <div style={{marginBottom:10}}>
          <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>
            {lang==="uz"?"Nomi (ru)":"Название (ru)"}
          </label>
          <input value={editSvc.name} onChange={e => setEditSvc(s => ({...s, name:e.target.value}))} style={inp} />
        </div>

        {/* Name UZ */}
        <div style={{marginBottom:10}}>
          <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>
            {lang==="uz"?"Nomi (uz)":"Название (uz)"}
          </label>
          <input value={editSvc.nameUz} onChange={e => setEditSvc(s => ({...s, nameUz:e.target.value}))} style={inp} />
        </div>

        {/* Price */}
        <div style={{marginBottom:14}}>
          <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>
            {lang==="uz"?"Narxi (so'mda)":"Цена (в сумах)"}
          </label>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <input type="number" value={editSvc.price}
              onChange={e => setEditSvc(s => ({...s, price:+e.target.value}))}
              style={{...inp, flex:1}} />
            <span style={{fontWeight:700, color:tx2, fontSize:13, flexShrink:0}}>сум</span>
          </div>
          {editSvc.price > 0 && currency !== "uzs" && (
            <div style={{fontSize:11, color:tx3, marginTop:3}}>≈ {fp(editSvc.price)}</div>
          )}
        </div>

        {/* Duration */}
        <div style={{marginBottom:18}}>
          <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:7}}>
            {lang==="uz"?"Davomiylik":"Длительность"}
          </label>
          <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6}}>
            {durOpts.map(v => (
              <button key={v} onClick={() => setEditSvc(s => ({...s, dur:v}))}
                style={{height:36, borderRadius:10,
                  border:`1.5px solid ${editSvc.dur===v?acc2:bd}`,
                  background:editSvc.dur===v?"rgba(255,107,157,.12)":sf2,
                  color:editSvc.dur===v?acc2:tx2,
                  fontWeight:600, fontSize:12, cursor:"pointer", fontFamily:"inherit"}}>
                {v < 60 ? v+"'" : (v/60)+(v%60?"ч"+v%60+"'":"ч")}
              </button>
            ))}
          </div>
        </div>

        <button onClick={() => {
          if (!editSvc.name.trim()) { showToast(lang==="uz"?"Nomni kiriting":"Введите название","⚠️"); return; }
          setMyServices(prev => prev.map(s => s.id===editSvc.id ? {...editSvc} : s));
          showToast(lang==="uz"?"Xizmat yangilandi!":"Услуга обновлена!","✅");
          setModal(null);
        }} style={priBtn}>{lang==="uz"?"Saqlash":"Сохранить"}</button>
        <button onClick={() => setModal(null)} style={secBtn}>{lang==="uz"?"Bekor qilish":"Отмена"}</button>
      </Modal>
    );
  }

  function modalTg() {
    return (
      <Modal isDark={dark} open={modal==="tg"} onClose={() => setModal(null)}>
        <div style={{fontWeight:800, fontSize:18, marginBottom:13, color:tx}}>📨 Telegram</div>
        <div style={{background:sf2, borderRadius:11, padding:13, fontSize:13, lineHeight:1.6, marginBottom:13, border:`1px solid ${cb}`, whiteSpace:"pre-line", color:tx}}>{tgMsg}</div>
        <button onClick={() => { setModal(null); showToast(lang==="uz"?"Yuborildi!":"Отправлено!","✈️"); }}
          style={{width:"100%", height:40, borderRadius:11, border:"none", background:"linear-gradient(135deg,#0088cc,#229ED9)", color:"#fff", fontWeight:700, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:7, marginBottom:8, fontFamily:"inherit"}}>
          ✈️ {lang==="uz"?"Telegramda ochish":"Открыть в Telegram"}
        </button>
        <button onClick={() => setModal(null)} style={{...secBtn, marginTop:0}}>{lang==="uz"?"Bekor qilish":"Отмена"}</button>
      </Modal>
    );
  }

  function modalExpense() {
    return (
      <Modal isDark={dark} open={modal==="expense"} onClose={() => setModal(null)}>
        <div style={{fontWeight:800, fontSize:18, marginBottom:15, color:tx}}>💸 {lang==="uz"?"Xarajat qo'shish":"Добавить расход"}</div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:7}}>{lang==="uz"?"Kategoriya":"Категория"}</label>
          <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6}}>
            {EXP_CATS.map(cat => (
              <button key={cat.id} onClick={() => setExpForm(f => ({...f, catId:cat.id}))}
                style={{borderRadius:11, border:`1.5px solid ${expForm.catId===cat.id?"#F43F5E":bd}`, background:expForm.catId===cat.id?"rgba(244,63,94,.1)":sf2, padding:"8px 4px", display:"flex", flexDirection:"column", alignItems:"center", gap:2, cursor:"pointer", fontFamily:"inherit"}}>
                <span style={{fontSize:19}}>{cat.emoji}</span>
                <span style={{fontSize:9, fontWeight:600, color:expForm.catId===cat.id?"#F43F5E":tx3, textAlign:"center", lineHeight:1.2}}>{lang==="uz"?cat.uz:cat.ru}</span>
              </button>
            ))}
          </div>
        </div>
        <div style={{marginBottom:10}}><label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>{lang==="uz"?"Tavsif":"Описание"}</label><input value={expForm.desc} onChange={e => setExpForm(f => ({...f, desc:e.target.value}))} style={inp} placeholder={lang==="uz"?"Gel-lak OPI...":"Гель-лаки OPI..."} /></div>
        <div style={{marginBottom:10}}><label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>{lang==="uz"?"Summa (so'mda)":"Сумма (в сумах)"}</label>
          <input type="number" value={expForm.amtUzs} onChange={e => setExpForm(f => ({...f, amtUzs:e.target.value}))} style={inp} placeholder="0" />
          {+expForm.amtUzs > 0 && currency !== "uzs" && <div style={{fontSize:11, color:tx3, marginTop:3}}>≈ {fp(+expForm.amtUzs)}</div>}
        </div>
        <div style={{marginBottom:15}}><label style={{fontSize:12, fontWeight:600, color:tx2, display:"block", marginBottom:5}}>{lang==="uz"?"Sana":"Дата"}</label><input type="date" value={expForm.date} onChange={e => setExpForm(f => ({...f, date:e.target.value}))} style={inp} /></div>
        <button onClick={saveExp} style={{...priBtn, background:"linear-gradient(135deg,#F43F5E,#FB7185)"}}>{lang==="uz"?"Saqlash":"Сохранить расход"}</button>
        <button onClick={() => setModal(null)} style={secBtn}>{lang==="uz"?"Bekor qilish":"Отмена"}</button>
      </Modal>
    );
  }

  // ── MAIN RENDER ──
  return (
    <div style={{minHeight:"100vh", background:dark?"#050210":"#EEE0F8", display:"flex", alignItems:"center", justifyContent:"center"}}>
      <style>{`@keyframes slideUp{from{transform:translateY(80%);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes slideDown{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes popIn{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes ping{0%{transform:scale(1);opacity:.9}70%{transform:scale(2.5);opacity:0}100%{transform:scale(2.5);opacity:0}}@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes glow-pulse{0%,100%{box-shadow:0 0 20px rgba(255,107,157,.3)}50%{box-shadow:0 0 40px rgba(255,107,157,.5)}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}`}</style>
      <div style={{width:"min(390px,100vw)", height:"min(844px,100vh)", background:bg, borderRadius:"clamp(0px,4vw,46px)", overflow:"hidden", position:"relative", boxShadow:"0 50px 120px rgba(0,0,0,.8),0 0 0 14px rgba(13,6,32,.98),0 0 0 15px rgba(255,107,157,.06),0 0 0 28px rgba(0,0,0,.7)", display:"flex", flexDirection:"column", transition:"background .4s"}}>
        {toast && <Toast msg={toast.msg} icon={toast.icon} />}
        <div style={{height:42, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 22px", flexShrink:0}}>
          <span style={{fontSize:15, fontWeight:600, color:tx}}>{new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}</span>
          <span style={{fontSize:12}}>📶 🔋</span>
        </div>
        <div style={{padding:"2px 18px 8px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0}}>
          <div onClick={() => setLicScreen(true)} style={{display:"flex", alignItems:"center", gap:7, cursor:"pointer"}}>
            <div style={{fontWeight:800, fontSize:17, background:"linear-gradient(135deg,#FF6B9D,#C084FC)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent"}}>✦ GulCRM {PROFILES[profile].emoji}</div>
            {checkLicense(license)
              ? <span style={{fontSize:10,fontWeight:700,background:"rgba(52,211,153,.15)",color:"#34D399",padding:"2px 8px",borderRadius:10,border:"1px solid rgba(52,211,153,.3)"}}>PRO</span>
              : <span style={{fontSize:10,fontWeight:700,background:"rgba(255,107,157,.15)",color:"#FF6B9D",padding:"2px 8px",borderRadius:10,border:"1px solid rgba(255,107,157,.35)"}}>
                  {isTrialActive() ? trialDaysLeft()+"д" : "⚠️"}
                </span>
            }
          </div>
          <div style={{display:"flex", gap:6, alignItems:"center"}}>
            <button onClick={() => setLang(l => l==="ru"?"uz":"ru")} style={{height:27, padding:"0 11px", borderRadius:13, border:`1.5px solid ${bd}`, background:sf, fontSize:11, fontWeight:700, color:tx2, cursor:"pointer", fontFamily:"inherit"}}>{lang.toUpperCase()}</button>
            <div onClick={() => setDark(d => !d)} style={{width:40, height:22, borderRadius:11, background:dark?acc2:"rgba(0,0,0,.1)", border:`1.5px solid ${bd}`, cursor:"pointer", position:"relative", transition:"background .3s"}}>
              <div style={{position:"absolute", top:2, left:dark?20:2, width:14, height:14, borderRadius:"50%", background:dark?"#fff":acc2, transition:"left .3s", display:"flex", alignItems:"center", justifyContent:"center", fontSize:8}}>{dark?"🌙":"☀️"}</div>
            </div>
          </div>
        </div>
        <div style={{flex:1, overflow:"hidden", position:"relative"}}>
          {/* License screen - shown when clicked or trial expired */}
          {(licScreen || (!checkLicense(license) && !isTrialActive())) && screenLicense()}
          <div style={{position:"absolute", inset:0, overflowY:"auto"}}>
            {screen === "dashboard" && screenDashboard()}
            {screen === "calendar"  && screenCalendar()}
            {screen === "clients"   && screenClients()}
            {screen === "finance"   && screenFinance()}
            {screen === "stats"     && screenStats()}
            {screen === "settings"  && screenSettings()}
            {screen === "marketing" && screenMarketing()}
          </div>
          {(screen === "calendar" || screen === "dashboard") && canAddAny && (
            <button onClick={() => { if(screen==="dashboard") setScreen("calendar"); openAdd(); }} style={{position:"absolute", bottom:14, right:14, width:58, height:58, borderRadius:"50%", border:"none", background:grad, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:glow+",0 0 0 4px rgba(255,107,157,.12)", cursor:"pointer", zIndex:10, animation:"glow-pulse 2.5s ease-in-out infinite", transition:"transform .2s cubic-bezier(.34,1.56,.64,1)"}}
              onPointerDown={e=>e.currentTarget.style.transform="scale(.9)"}
              onPointerUp={e=>e.currentTarget.style.transform="scale(1)"}
              onPointerLeave={e=>e.currentTarget.style.transform="scale(1)"}>
              <Plus size={24} strokeWidth={2.5}/></button>
          )}
          {modalEditSvc()}
          {modalCloseAppt()}
          {modalAppt()}
          {modalClient()}
          {modalNewClient()}
          {modalTg()}
          {modalExpense()}
        </div>
        <div style={{height:68, background:dark?"rgba(13,6,32,.96)":"rgba(255,245,251,.96)", backdropFilter:"blur(20px)", borderTop:"1px solid "+bd, display:"flex", alignItems:"center", justifyContent:"space-around", padding:"0 4px 6px", flexShrink:0, boxShadow:dark?"0 -6px 24px rgba(0,0,0,.4)":"0 -4px 20px rgba(192,84,252,.06)", transition:"all .4s"}}>
          {NAV.map(n => (
            <div key={n.id} onClick={() => setScreen(n.id)} style={{display:"flex", flexDirection:"column", alignItems:"center", gap:3, cursor:"pointer", padding:"6px 10px", borderRadius:16, minWidth:54,
                background:screen===n.id?(dark?"rgba(255,107,157,.12)":"rgba(224,64,154,.07)"):"transparent",
                transition:"all .25s cubic-bezier(.34,1.56,.64,1)",
                transform:screen===n.id?"scale(1.06)":"scale(1)"}}>
              <span style={{color:screen===n.id?acc:tx3, display:"flex", transition:"all .25s",
                filter:screen===n.id?("drop-shadow(0 0 6px "+acc+"99)"):"none",
                transform:screen===n.id?"scale(1.1)":"scale(1)"}}>
                {n.ic}
              </span>
              <span style={{fontSize:9, fontWeight:700, color:screen===n.id?acc:tx3, textAlign:"center", letterSpacing:.2, transition:"color .2s"}}>
                {lang==="uz"?n.uz:n.ru}
              </span>
              {screen===n.id&&<div style={{width:16,height:2,borderRadius:2,background:grad}}/>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    setTimeout(()=>{
      const l=document.getElementById('loading');
      if(l){l.style.opacity='0';setTimeout(()=>l.remove(),600);}
    },1000);
  </script>
</body>
</html>
